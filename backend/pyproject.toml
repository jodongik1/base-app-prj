[project]
name = "base-app-backend"
version = "0.1.0"
description = "FastAPI foundation for the base app template"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
