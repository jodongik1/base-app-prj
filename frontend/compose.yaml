services:
  frontend:
    build: .
    ports:
      - "${HOST_BIND_IP:?HOST_BIND_IP is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}

volumes:
  frontend_node_modules:
